# Cordis patch layer for dsh-webstack (and dsh-advanced-web-search alias)
# Configures ctx.web to use SearXNG and Scrapling, tunes tool-web bounds for local LLMs,
# and mounts the provider bundle.

- id: web
  config:
    searchProvider: searxng
    fetchProvider: scrapling

- id: tool-web
  config:
    fetch: true
    searchTimeoutMs: 30000
    searchMaxResults: 8
    searchMaxQueries: 4
    fetchMaxOutputChars: 50000

- insert:
    - id: dsh-webstack
      name: dsh-webstack
      config:
        searxng:
          baseURL: http://127.0.0.1:8080
          timeoutMs: 15000
        scrapling:
          timeoutMs: 20000
          maxRedirects: 5
          maxResponseBytes: 5000000
          enableDynamicFallback: true
          enableStealthFallback: true
          stealthSolveCloudflare: true
          stealthHideCanvas: true
          stealthBlockWebRtc: true
          stealthAllowWebGl: true
          stealthGoogleSearch: true
          stealthBlockAds: true
          stealthRealChrome: true
          stealthTimeoutMs: 60000
    - id: dsh-advanced-web-search
      name: dsh-advanced-web-search
      config:
        searxng:
          baseURL: http://127.0.0.1:8080
          timeoutMs: 15000
        scrapling:
          timeoutMs: 20000
          maxRedirects: 5
          maxResponseBytes: 5000000
          enableDynamicFallback: true
          enableStealthFallback: true
          stealthSolveCloudflare: true
          stealthHideCanvas: true
          stealthBlockWebRtc: true
          stealthAllowWebGl: true
          stealthGoogleSearch: true
          stealthBlockAds: true
          stealthRealChrome: true
          stealthTimeoutMs: 60000
